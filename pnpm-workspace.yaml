packages:
  - apps/*
  - packages/*
  - tooling

# `vsce publish` in CI needs vsce-sign's postinstall.
# keytar is vsce's local credential store, which CI does not use.
# cpu-features, ssh2 and protobufjs come with testcontainers (via dockerode) and
# only speed up Docker over SSH.
allowBuilds:
  '@vscode/vsce-sign': true
  cpu-features: false
  esbuild: true
  keytar: false
  protobufjs: false
  ssh2: false
